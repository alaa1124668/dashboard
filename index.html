<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>داشبورد متابعة الأداء والتارجت اليومي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap');
        body { font-family: 'Tajawal', sans-serif; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen">

    <header class="bg-slate-800 border-b border-slate-700 p-4 sticky top-0 z-50">
        <div class="container mx-auto flex justify-between items-center">
            <div class="flex items-center gap-3">
                <i class="fa-solid fa-chart-line text-amber-500 text-2xl"></i>
                <h1 class="text-xl font-bold">داشبورد متابعة الأداء والتارجت اليومي</h1>
            </div>
            <div id="last-updated" class="text-xs bg-slate-700 px-3 py-1 rounded-full text-slate-300">
                <i class="fa-solid fa-spinner fa-spin me-1"></i> جاري تحميل البيانات...
            </div>
        </div>
    </header>

    <div class="container mx-auto p-4 md:p-6 space-y-6">

        <div id="error-banner" class="hidden bg-red-900/50 border border-red-500 text-red-200 p-4 rounded-xl text-sm">
            <i class="fa-solid fa-triangle-exclamation text-red-400 me-2"></i>
            <span id="error-msg">حدث خطأ أثناء تحميل البيانات.</span>
        </div>

        <div class="bg-slate-800 p-2 rounded-xl border border-slate-700 flex flex-wrap gap-2" id="sheets-nav-container"></div>

        <!-- كروت KPI الأداء -->
        <div id="kpi-cards-container" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-5 gap-4">
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">مش شغال خالص</p>
                <h3 id="kpi-1" class="text-2xl font-extrabold text-red-500 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">مناديب موقوفين</p>
                <h3 id="kpi-2" class="text-2xl font-extrabold text-orange-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">غياب متكرر</p>
                <h3 id="kpi-3" class="text-2xl font-extrabold text-yellow-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">أيام عمل قليلة (1-2)</p>
                <h3 id="kpi-4" class="text-2xl font-extrabold text-sky-400 mt-1">0</h3>
            </div>
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700">
                <p class="text-slate-400 text-xs">أداء ضعيف (ساعات قليلة)</p>
                <h3 id="kpi-5" class="text-2xl font-extrabold text-purple-400 mt-1">0</h3>
            </div>
        </div>

        <!-- الرسم البياني -->
        <div id="chart-section" class="bg-slate-800 p-5 rounded-xl border border-slate-700">
            <h2 class="text-lg font-bold mb-4 text-slate-200"><i class="fa-solid fa-chart-pie me-2 text-amber-500"></i> توزيع الأداء والحالات</h2>
            <div class="h-64 relative">
                <canvas id="performanceChart"></canvas>
            </div>
        </div>

        <!-- الجدول الرئيسي -->
        <div class="bg-slate-800 rounded-xl border border-slate-700 overflow-hidden">
            <div class="flex overflow-x-auto border-b border-slate-700 bg-slate-800/50 p-2 gap-2" id="category-tabs-container"></div>

            <div class="p-4 bg-slate-800/80 border-b border-slate-700 flex flex-wrap gap-4 items-center justify-between">
                <div class="relative flex-1 min-w-[240px]">
                    <i class="fa-solid fa-magnifying-glass absolute right-3 top-3 text-slate-400"></i>
                    <input type="text" id="search-input" placeholder="بحث بالمنطقة أو البيان..." 
                           class="w-full bg-slate-900 border border-slate-700 rounded-lg pr-9 pl-4 py-2 text-sm text-slate-100 focus:outline-none focus:border-amber-500">
                </div>
                <div class="text-xs text-slate-400">
                    عدد السجلات: <span id="record-count" class="font-bold text-amber-400">0</span>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-sm text-right text-slate-300">
                    <thead id="table-head" class="text-xs uppercase bg-slate-900/80 text-slate-400 border-b border-slate-700">
                    </thead>
                    <tbody id="table-body" class="divide-y divide-slate-700/50">
                        <tr>
                            <td colspan="9" class="text-center py-6 text-slate-400"><i class="fa-solid fa-spinner fa-spin me-2"></i> جاري تحميل البيانات...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const SHEETS_CONFIG = [
            {
                id: 'sheet_performance',
                name: 'تقرير الأداء الرئيسي',
                icon: 'fa-chart-line',
                apiUrl: 'https://script.google.com/macros/s/AKfycbxlx4qkVkjvLe-axw8OboOZaagKbDr0j5uMjTO7wsxXjdWZL7AVU4aA7YRVPwfd_pxi/exec'
            },
            {
                id: 'sheet_daily_target',
                name: 'التارجت اليومي',
                icon: 'fa-bullseye',
                apiUrl: 'https://script.google.com/macros/s/AKfycbz_RgmGZ18v8V66-ySFUCJcp0gcH0CT6U-9J-AwQDF9ylDpcWlJkklkGbzlzfw9q2k6/exec'
            }
        ];

        let activeSheetId = SHEETS_CONFIG[0].id;
        let currentTabCategory = "كل البيانات";
        let chartInstance = null;
        let processedDataList = [];

        let rawData = {
            "كل البيانات": [],
            "مش شغال خالص": [],
            "موقوف": [],
            "غياب متكرر": [],
            "أيام عمل قليلة (1-2)": [],
            "أداء ضعيف (ساعات قليلة)": []
        };

        function hideError() { document.getElementById('error-banner').classList.add('hidden'); }
        function showError(msg) {
            document.getElementById('error-msg').innerText = msg;
            document.getElementById('error-banner').classList.remove('hidden');
        }

        function renderSheetsNav() {
            const container = document.getElementById('sheets-nav-container');
            container.innerHTML = '';
            SHEETS_CONFIG.forEach(sheet => {
                const isActive = sheet.id === activeSheetId;
                const btn = document.createElement('button');
                btn.className = `flex items-center gap-2 px-5 py-2.5 rounded-lg font-bold text-sm transition-all ${
                    isActive ? 'bg-amber-500 text-slate-900 shadow-lg shadow-amber-500/20' : 'bg-slate-700/50 text-slate-300 hover:bg-slate-700 hover:text-white'
                }`;
                btn.innerHTML = `<i class="fa-solid ${sheet.icon}"></i> ${sheet.name}`;
                btn.onclick = () => switchSheet(sheet.id);
                container.appendChild(btn);
            });
        }

        function switchSheet(sheetId) {
            activeSheetId = sheetId;
            currentTabCategory = "كل البيانات";
            renderSheetsNav();
            loadSheetData();
        }

        function formatExcelDate(val) {
            if (!val) return '-';
            if (typeof val === 'string' && val.includes('T')) {
                const dateObj = new Date(val);
                if (!isNaN(dateObj.getTime())) {
                    return dateObj.toLocaleDateString('ar-EG', { month: 'short', day: 'numeric', year: 'numeric' });
                }
            }
            return String(val);
        }

        function formatHoursVal(numVal) {
            if (typeof numVal !== 'number') return String(numVal || '0:00');
            let totalSec = numVal < 1 ? numVal * 86400 : numVal * 3600;
            let hours = Math.floor(totalSec / 3600);
            let mins = Math.round((totalSec % 3600) / 60);
            return `${hours}:${mins < 10 ? '0' : ''}${mins}`;
        }

        async function loadSheetData() {
            hideError();
            const sheet = SHEETS_CONFIG.find(s => s.id === activeSheetId);
            if (!sheet) return;

            document.getElementById('last-updated').innerHTML = `<i class="fa-solid fa-spinner fa-spin me-1"></i> جاري تحميل ${sheet.name}...`;

            try {
                const response = await fetch(sheet.apiUrl, { redirect: 'follow' });
                if (!response.ok) throw new Error('فشل جلب البيانات');
                
                const rows = await response.json();
                
                if (Array.isArray(rows) && rows.length > 0) {
                    if (activeSheetId === 'sheet_daily_target') {
                        document.getElementById('kpi-cards-container').classList.add('hidden');
                        document.getElementById('chart-section').classList.add('hidden');
                        document.getElementById('category-tabs-container').classList.add('hidden');
                        parseTargetSheetData(rows);
                    } else {
                        document.getElementById('kpi-cards-container').classList.remove('hidden');
                        document.getElementById('chart-section').classList.remove('hidden');
                        document.getElementById('category-tabs-container').classList.remove('hidden');
                        parsePerformanceSheetData(rows);
                    }
                    document.getElementById('last-updated').innerHTML = `<i class="fa-regular fa-clock me-1"></i> ${sheet.name} (تم التحديث: ${new Date().toLocaleTimeString('ar-EG')})`;
                } else {
                    showError('البيانات المستلمة فارغة.');
                }
            } catch (err) {
                console.error(err);
                showError('تعذر جلب البيانات من Apps Script.');
                document.getElementById('last-updated').innerHTML = `<i class="fa-solid fa-circle-exclamation text-red-400 me-1"></i> خطأ التحميل`;
            }
        }

        // معالجة شيت التارجت اليومي
        function parseTargetSheetData(rows) {
            let targetList = [];

            for (let r = 1; r < rows.length; r++) {
                const row = rows[r];
                if (!Array.isArray(row) || row.length < 3) continue;

                let zone = row[0] ? String(row[0]).trim() : '';
                let rawDate = row[1];
                let avgRiders = row[2] !== undefined ? Math.round(Number(row[2]) || 0) : 0;
                let avgHours = row[3] !== undefined ? row[3] : 0;

                if (!zone || zone === 'Daily Target' || zone === 'Active') continue;

                targetList.push({
                    zone: zone,
                    date: formatExcelDate(rawDate),
                    avgRiders: avgRiders,
                    avgHours: typeof avgHours === 'number' ? formatHoursVal(avgHours) : avgHours
                });
            }

            processedDataList = targetList;
            renderTargetTable();
        }

        function renderTargetTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            thead.innerHTML = `
                <tr>
                    <th class="px-6 py-3">المنطقة (Zone)</th>
                    <th class="px-6 py-3 text-center">اليوم / التاريخ</th>
                    <th class="px-6 py-3 text-center">متوسط عدد المناديب</th>
                    <th class="px-6 py-3 text-center">متوسط الساعات اليومية</th>
                </tr>
            `;

            const filtered = processedDataList.filter(item => 
                item.zone.toLowerCase().includes(searchVal) || 
                item.date.toLowerCase().includes(searchVal)
            );

            document.getElementById('record-count').innerText = filtered.length;
            tbody.innerHTML = '';

            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="4" class="text-center py-6 text-slate-500">لا توجد بيانات تارجت مطابقة.</td></tr>`;
                return;
            }

            filtered.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition border-b border-slate-700/40';
                tr.innerHTML = `
                    <td class="px-6 py-4 font-bold text-amber-400">${item.zone}</td>
                    <td class="px-6 py-4 text-center font-mono text-slate-300">${item.date}</td>
                    <td class="px-6 py-4 text-center font-extrabold text-sky-400">${item.avgRiders} مندوب</td>
                    <td class="px-6 py-4 text-center font-mono text-emerald-400 font-bold">${item.avgHours}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        // معالجة شيت تقرير الأداء
        function parsePerformanceSheetData(rows) {
            if (rows.length < 2) return;
            const headers = rows[0].map(h => String(h || '').trim());

            let riderIdIdx = headers.findIndex(c => c.toLowerCase().includes('rider id') || c.includes('كود'));
            let riderNameIdx = headers.findIndex(c => c.toLowerCase().includes('rider name') || c.includes('اسم'));
            let zoneIdx = headers.findIndex(c => c.toLowerCase().includes('zone') || c.includes('منطقة'));
            let supervisorIdx = headers.findIndex(c => c.includes('المشرف') || c.toLowerCase().includes('supervisor'));

            if (riderIdIdx === -1) riderIdIdx = 0;
            if (riderNameIdx === -1) riderNameIdx = 1;
            if (zoneIdx === -1) zoneIdx = 2;
            if (supervisorIdx === -1) supervisorIdx = 3;

            let parsedData = [];

            for (let r = 1; r < rows.length; r++) {
                const row = rows[r];
                if (!Array.isArray(row)) continue;

                const riderId = row[riderIdIdx] !== undefined ? String(row[riderIdIdx]).trim() : '';
                const riderName = row[riderNameIdx] !== undefined ? String(row[riderNameIdx]).trim() : '';
                const zone = row[zoneIdx] !== undefined ? String(row[zoneIdx]).trim() : '';
                const supervisor = row[supervisorIdx] !== undefined ? String(row[supervisorIdx]).trim() : '';

                if (!riderId && !riderName) continue;

                let workDays = 0, notWorkingDays = 0, absDays = 0, susDays = 0, totalHoursSec = 0;

                for (let i = 4; i < row.length; i++) {
                    const cellVal = row[i];
                    if (cellVal === null || cellVal === undefined) continue;
                    const val = String(cellVal).trim();
                    if (!val) continue;

                    if (val.includes('غياب')) { absDays++; notWorkingDays++; }
                    else if (val.includes('موقوف')) { susDays++; notWorkingDays++; }
                    else if (val.includes('مش مختار')) { notWorkingDays++; }
                    else if (typeof cellVal === 'number' || val.includes(':') || !isNaN(val)) {
                        workDays++;
                        if (typeof cellVal === 'number') {
                            totalHoursSec += cellVal < 1 ? cellVal * 86400 : cellVal * 3600;
                        } else if (val.includes(':')) {
                            const parts = val.split(':').map(Number);
                            if (parts.length >= 2) totalHoursSec += (parts[0] * 3600) + (parts[1] * 60) + (parts[2] || 0);
                        }
                    }
                }

                const hours = Math.floor(totalHoursSec / 3600);
                const mins = Math.floor((totalHoursSec % 3600) / 60);

                parsedData.push({
                    "كود المندوب": riderId,
                    "الاسم": riderName,
                    "المنطقة": zone,
                    "المشرف": supervisor,
                    "أيام العمل": workDays,
                    "أيام عدم العمل": notWorkingDays,
                    "إجمالي الساعات": `${hours}:${mins < 10 ? '0' : ''}${mins}`,
                    "ساعات بالثواني": totalHoursSec,
                    "الغياب": absDays,
                    "الإيقاف": susDays
                });
            }

            processPerformanceSheetData(parsedData);
        }

        function processPerformanceSheetData(items) {
            Object.keys(rawData).forEach(key => rawData[key] = []);

            items.forEach(item => {
                rawData["كل البيانات"].push(item);
                if (item["أيام العمل"] === 0) rawData["مش شغال خالص"].push(item);
                if (item["الإيقاف"] > 0) rawData["موقوف"].push(item);
                if (item["الغياب"] > 0) rawData["غياب متكرر"].push(item);
                if (item["أيام العمل"] === 1 || item["أيام العمل"] === 2) rawData["أيام عمل قليلة (1-2)"].push(item);
                if (item["أيام العمل"] > 2 && item["ساعات بالثواني"] < (item["أيام العمل"] * 6 * 3600)) rawData["أداء ضعيف (ساعات قليلة)"].push(item);
            });

            updateKPIs();
            renderChart();
            renderCategoryTabs();
            renderPerformanceTable();
        }

        function updateKPIs() {
            document.getElementById('kpi-1').innerText = rawData["مش شغال خالص"].length;
            document.getElementById('kpi-2').innerText = rawData["موقوف"].length;
            document.getElementById('kpi-3').innerText = rawData["غياب متكرر"].length;
            document.getElementById('kpi-4').innerText = rawData["أيام عمل قليلة (1-2)"].length;
            document.getElementById('kpi-5').innerText = rawData["أداء ضعيف (ساعات قليلة)"].length;
        }

        function renderChart() {
            const ctx = document.getElementById('performanceChart').getContext('2d');
            if (chartInstance) chartInstance.destroy();
            const categories = ["مش شغال خالص", "موقوف", "غياب متكرر", "أيام عمل قليلة (1-2)", "أداء ضعيف (ساعات قليلة)"];

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: categories,
                    datasets: [{
                        label: 'عدد المناديب',
                        data: categories.map(cat => rawData[cat].length),
                        backgroundColor: ['rgba(239, 68, 68, 0.8)', 'rgba(251, 146, 60, 0.8)', 'rgba(250, 204, 21, 0.8)', 'rgba(56, 189, 248, 0.8)', 'rgba(192, 132, 252, 0.8)'],
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: {
                        x: { ticks: { color: '#94a3b8' }, grid: { display: false } },
                        y: { ticks: { color: '#94a3b8' }, grid: { color: '#334155' } }
                    }
                }
            });
        }

        function renderCategoryTabs() {
            const container = document.getElementById('category-tabs-container');
            container.innerHTML = '';
            Object.keys(rawData).forEach((categoryName) => {
                const btn = document.createElement('button');
                const isActive = categoryName === currentTabCategory;
                btn.className = `px-4 py-2 text-sm font-semibold rounded-lg transition whitespace-nowrap ${isActive ? 'bg-amber-500 text-slate-900' : 'text-slate-400 hover:bg-slate-700 hover:text-slate-200'}`;
                btn.innerText = `${categoryName} (${rawData[categoryName].length})`;
                btn.onclick = () => {
                    currentTabCategory = categoryName;
                    renderCategoryTabs();
                    renderPerformanceTable();
                };
                container.appendChild(btn);
            });
        }

        function renderPerformanceTable() {
            const thead = document.getElementById('table-head');
            const tbody = document.getElementById('table-body');
            const searchVal = document.getElementById('search-input').value.toLowerCase();

            thead.innerHTML = `
                <tr>
                    <th class="px-4 py-3">Rider ID</th>
                    <th class="px-4 py-3">Rider Name</th>
                    <th class="px-4 py-3">Zone</th>
                    <th class="px-4 py-3">اسم المشرف</th>
                    <th class="px-4 py-3 text-center">أيام العمل</th>
                    <th class="px-4 py-3 text-center">أيام عدم العمل</th>
                    <th class="px-4 py-3 text-center">إجمالي الساعات</th>
                    <th class="px-4 py-3 text-center">الغياب</th>
                    <th class="px-4 py-3 text-center">الإيقاف</th>
                </tr>
            `;

            const list = rawData[currentTabCategory] || [];
            const filteredData = list.filter(item => 
                String(item["كود المندوب"]).toLowerCase().includes(searchVal) ||
                String(item["الاسم"]).toLowerCase().includes(searchVal) ||
                String(item["المنطقة"]).toLowerCase().includes(searchVal) ||
                String(item["المشرف"]).toLowerCase().includes(searchVal)
            );

            document.getElementById('record-count').innerText = filteredData.length;
            tbody.innerHTML = '';

            if (filteredData.length === 0) {
                tbody.innerHTML = `<tr><td colspan="9" class="text-center py-6 text-slate-500">لا توجد بيانات مطابقة.</td></tr>`;
                return;
            }

            filteredData.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = 'hover:bg-slate-700/30 transition border-b border-slate-700/40';
                tr.innerHTML = `
                    <td class="px-4 py-3 font-mono text-amber-400">${item["كود المندوب"]}</td>
                    <td class="px-4 py-3 font-medium text-slate-200">${item["الاسم"]}</td>
                    <td class="px-4 py-3"><span class="bg-slate-700 text-slate-300 px-2 py-0.5 rounded text-xs">${item["المنطقة"]}</span></td>
                    <td class="px-4 py-3 text-slate-400">${item["المشرف"]}</td>
                    <td class="px-4 py-3 text-center font-bold text-slate-200">${item["أيام العمل"]}</td>
                    <td class="px-4 py-3 text-center text-slate-400">${item["أيام عدم العمل"]}</td>
                    <td class="px-4 py-3 text-center font-mono">${item["إجمالي الساعات"]}</td>
                    <td class="px-4 py-3 text-center text-slate-300">${item["الغياب"]}</td>
                    <td class="px-4 py-3 text-center text-slate-300">${item["الإيقاف"]}</td>
                `;
                tbody.appendChild(tr);
            });
        }

        document.getElementById('search-input').addEventListener('input', () => {
            if (activeSheetId === 'sheet_daily_target') renderTargetTable();
            else renderPerformanceTable();
        });

        renderSheetsNav();
        loadSheetData();
    </script>
</body>
</html>
